server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # El service worker y su manifiesto nunca deben cachearse, o las actualizaciones no llegan
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /ngsw.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Archivos estáticos de Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Redirección de peticiones API al backend Dockerizado
  location ^~ /api/ {
    proxy_pass http://inventario-backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}
