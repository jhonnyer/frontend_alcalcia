<section class="relative flex items-center justify-center min-h-[calc(100vh-6rem)] bg-gradient-to-br from-blue-50 via-white to-blue-100">
  <div class="absolute inset-0 bg-[url('/assets/img/bg-login.jpg')] bg-cover bg-center opacity-10"></div>

  <div class="z-10 w-full max-w-md p-8 bg-white/80 backdrop-blur-lg shadow-xl rounded-2xl border border-gray-200">
    <div class="text-center mb-6">
      <h3 class="text-2xl font-bold text-gray-800 mb-1">
        GESTION DE PROYECTOS E INVENTARIO
      </h3>
      <span class="text-gray-500 text-sm">Bienvenido(a) al sistema</span>
    </div>

    <form [formGroup]="formFamilyCore" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="label-base">Usuario</label>
        <input formControlName="usuario" type="text" class="input-base" placeholder="nombre de usuario" />
      </div>

      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          class="input-base pr-10"
        />
        <mat-icon
          class="absolute right-3 top-2 text-gray-500 cursor-pointer"
          (click)="togglePasswordVisibility()"
        >
          {{ showPassword ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </div>

      <div>
        <label class="label-base">Secretaría</label>
        @if (requiresSecretarySelection) {
          <select formControlName="idSecretaria" class="input-base">
            <option [ngValue]="null" disabled>Selecciona una secretaría</option>
            @for (secretaria of secretarias; track secretaria.idSecretaria) {
              <option [ngValue]="secretaria.idSecretaria">
                {{ secretaria.nombre }} ({{ secretaria.codigo }})
              </option>
            }
          </select>
        } @else {
          <select formControlName="idSecretaria" class="input-base" [disabled]="true">
            <option value="" selected>Valida tus credenciales para continuar</option>
          </select>
        }
      </div>


      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex justify-center items-center gap-2 py-2.5 text-white font-semibold bg-blue-600 hover:bg-blue-700 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        @if(isLoading) {
          <mat-spinner diameter="20"></mat-spinner>
          {{ requiresSecretarySelection ? 'Ingresando...' : 'Validando credenciales...' }}
        } @else {
          {{ requiresSecretarySelection ? 'Iniciar sesión' : 'Validar credenciales' }}
        }
      </button>

      @if (credentialsValidated) {
        <div class="flex items-center justify-between gap-3 text-sm">
          <button
            type="button"
            class="text-gray-600 hover:text-gray-900 hover:underline"
            (click)="cancelSecretarySelection()"
          >
            Volver a validar credenciales
          </button>
          <button
            type="button"
            class="text-blue-600 hover:underline"
            (click)="goToRegister()"
          >
            Ir a registrarse
          </button>
        </div>
      }
    </form>

    <p class="mt-4 text-center text-sm text-gray-500">
      @if (!credentialsValidated) {
        ¿No tienes cuenta?
        <a routerLink="/auth/register" (click)="cancelSecretarySelection()" class="text-blue-600 hover:underline">Regístrate</a>
      }
    </p>
  </div>
</section>
