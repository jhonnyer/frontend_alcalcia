<section
  class="relative flex items-center justify-center min-h-[calc(100vh-6rem)] bg-gradient-to-br from-blue-50 via-white to-blue-100 overflow-hidden"
>
  <!-- 🔹 Fondo decorativo -->
  <div
    class="absolute inset-0 bg-[url('/assets/img/bg-register.jpg')] bg-cover bg-center opacity-10"
  ></div>

  <!-- 🔹 Tarjeta principal -->
  <div
    class="relative z-10 w-full max-w-3xl bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl border border-gray-200 p-8 md:p-10"
  >
    <!-- Encabezado -->
    <div class="text-center mb-8">
      <h3 class="text-2xl font-bold text-gray-800 mb-1">
        GESTION DE PROYECTOS E INVENTARIO
      </h3>
      <p class="text-gray-500 text-sm">Crea tu cuenta para continuar</p>
    </div>

    <!-- Formulario -->
    <form
      class="space-y-6"
      [formGroup]="formFamilyCore"
      (ngSubmit)="onSubmit()"
      autocomplete="off"
    >
      <!-- Usuario y correo -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Usuario</label>
          <input
            formControlName="usuario"
            type="text"
            class="input-base"
            placeholder="nombre de usuario"
          />
          <p
            *ngIf="formFamilyCore.get('usuario')?.touched && formFamilyCore.get('usuario')?.invalid"
            class="text-xs text-red-500 mt-1"
          >
            ⚠️ Campo obligatorio
          </p>
        </div>

        <div>
          <label class="label-base">Correo electrónico</label>
          <input
            formControlName="email"
            type="email"
            class="input-base"
            placeholder="beneficiario@correo.com"
          />
          <p
            *ngIf="formFamilyCore.get('email')?.touched && formFamilyCore.get('email')?.invalid"
            class="text-xs text-red-500 mt-1"
          >
            ⚠️ Campo obligatorio
          </p>
        </div>
      </div>

      <!-- Nombres -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Primer nombre</label>
          <input
            formControlName="primerNombre"
            type="text"
            class="input-base"
            placeholder="Ej: Juan"
          />
          <p
            *ngIf="formFamilyCore.get('primerNombre')?.touched && formFamilyCore.get('primerNombre')?.invalid"
            class="text-xs text-red-500 mt-1"
          >
            ⚠️ Campo obligatorio
          </p>
        </div>

        <div>
          <label class="label-base">Segundo nombre</label>
          <input
            formControlName="segundoNombre"
            type="text"
            class="input-base"
            placeholder="Ej: Carlos"
          />
        </div>
      </div>

      <!-- Apellidos -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Primer apellido</label>
          <input
            formControlName="primerApellido"
            type="text"
            class="input-base"
            placeholder="Ej: Pérez"
          />
          <p
            *ngIf="formFamilyCore.get('primerApellido')?.touched && formFamilyCore.get('primerApellido')?.invalid"
            class="text-xs text-red-500 mt-1"
          >
            ⚠️ Campo obligatorio
          </p>
        </div>

        <div>
          <label class="label-base">Segundo apellido</label>
          <input
            formControlName="segundoApellido"
            type="text"
            class="input-base"
            placeholder="Ej: López"
          />
        </div>
      </div>

      <!-- Documento -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Tipo de documento</label>
          <select formControlName="tipoIdentificacion" class="input-base">
            <option value="CC">Cédula de ciudadanía</option>
            <option value="TI">Tarjeta de identidad</option>
            <option value="CE">Cédula extranjera</option>
            <option value="PA">Pasaporte</option>
            <option value="NIT">NIT</option>
          </select>
        </div>

        <div>
          <label class="label-base">Número de documento</label>
          <input
            formControlName="numeroIdentificacion"
            type="text"
            class="input-base"
            placeholder="Ej: 1002456789"
          />
        </div>
      </div>

      <!-- Cargo y área -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Área</label>
          <input
            formControlName="area"
            type="text"
            class="input-base"
            placeholder="Ej: Planeación"
          />
        </div>
        <div>
          <label class="label-base">Cargo</label>
          <input
            formControlName="cargo"
            type="text"
            class="input-base"
            placeholder="Ej: Coordinador"
          />
        </div>
      </div>

      <!-- Teléfono -->
      <div>
        <label class="label-base">Teléfono</label>
        <input
          formControlName="telefono"
          type="tel"
          class="input-base"
          placeholder="+57 320 000 0000"
        />
      </div>

      <!-- Contraseñas -->
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="label-base">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="input-base"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label class="label-base">Confirmar contraseña</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="input-base"
            placeholder="••••••••"
          />
          <p
            *ngIf="formFamilyCore.hasError('match_password')"
            class="text-xs text-red-500 mt-1"
          >
            ⚠️ Las contraseñas no coinciden
          </p>
        </div>
      </div>

      <!-- Botón -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex justify-center items-center gap-2 py-2.5 font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isLoading) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
          Registrando...
        } @else {
          Registrarse
        }
      </button>

      <!-- Volver al login -->
      <p class="text-center text-sm text-gray-500">
        ¿Ya tienes una cuenta?
        <a routerLink="/auth" class="font-medium text-blue-600 hover:underline"
          >Inicia sesión</a
        >
      </p>
    </form>
  </div>
</section>
