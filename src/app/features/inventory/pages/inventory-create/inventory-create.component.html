<div class="rounded-2xl border border-gray-200 bg-white p-3 shadow-md sm:p-6">
  <form [formGroup]="formFamilyCore" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

    <!-- 🔹 Selección Proyecto y Categoría -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div>
        <label class="label-base">Proyecto</label>
        <select formControlName="idProyecto" class="input-base">
          <option value="">Seleccione un proyecto</option>
          @for (item of proyectos(); track item.proyecto.idProyecto) {
            <option [value]="item.proyecto.idProyecto">{{ item.proyecto.nombre }}</option>
          }
        </select>
      </div>

      <div>
        <label class="label-base">Categoría</label>
        <select formControlName="idCategoria" class="input-base">
          <option value="">Seleccione una categoría</option>
          @for (categoria of categoriasDisponibles(); track categoria.idCategoria) {
            <option [value]="categoria.idCategoria">{{ categoria.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- 🔹 Tabla de productos -->
    <div formArrayName="productos">
      <div class="overflow-x-auto w-full">
        <table class="min-w-[700px] w-full border-collapse border border-gray-300 text-sm rounded-md overflow-hidden">
          <thead class="bg-gray-100">
            <tr class="text-gray-700 text-left">
              <th class="border p-2">Nombre</th>
              <th class="border p-2 text-center">Stock</th>
              <th class="border p-2">Descripción</th>
              <th class="border p-2 text-center">Fecha Ingreso</th>
              <th class="border p-2 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let producto of productosArray.controls; index as i" [formGroupName]="i">
              <td class="border p-2">
                <input type="text" formControlName="nombreProducto" class="input-base" placeholder="Ej: Jabon">
              </td>
              <td class="border p-2 text-center">
                <input type="number" formControlName="stock" class="w-20 border rounded p-1 text-center" min="0">
              </td>
              <td class="border p-2">
                <input type="text" formControlName="descripcion" class="input-base" placeholder="Descripción...">
              </td>
              <td class="border p-2 text-center">
                <input type="date" formControlName="fechaIngreso" class="border rounded p-1">
              </td>
              <td class="border p-2 text-center">
                <button type="button" class="text-red-600 hover:text-red-800 font-semibold"
                        (click)="deleteProducto(i)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mt-3 flex justify-stretch sm:justify-end">
        <button type="button" class="btn-action-green" (click)="addProducto()">➕ Agregar producto</button>
      </div>
    </div>

    <!-- 🔹 Botones finales -->
    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end sm:gap-4">
      <button type="button" class="btn-action-gray" (click)="cancelar()">Cancelar</button>
      <button
        type="button"
        (click)="confirmarGuardar()"
        [disabled]="formFamilyCore.invalid"
        [ngClass]="{
          'bg-blue-600 hover:bg-blue-700 text-white': !formFamilyCore.invalid,
          'bg-gray-300 text-gray-500 cursor-not-allowed': formFamilyCore.invalid
        }"
        class="px-4 py-2 text-sm rounded-md transition-all duration-200"
      >
        Guardar
      </button>
    </div>
  </form>
</div>
