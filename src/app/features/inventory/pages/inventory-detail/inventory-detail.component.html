<div class="relative flex flex-col h-[calc(100vh-6rem)] overflow-x-auto scrollbar-custom">
  <div class="h-full">
    <app-table-template
      [data]="data"
      [displayedColumns]="displayedColumns"
      [columnSearch] = "columnSearch"
      (deleteItem) = "delete($event)"
      (updateItem) = "update($event)"
    />
    <div class="flex">
      <button type="button">Prev</button>
      <button type="button">Next</button>
    </div>
  </div>
</div>
