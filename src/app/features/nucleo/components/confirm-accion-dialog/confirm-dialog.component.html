<div class="p-4 max-w-md text-center">
  <!-- Icono de advertencia -->
  <div class="flex justify-center mb-4">
    <mat-icon class="text-yellow-500 text-5xl">help_outline</mat-icon>
  </div>

  <!-- Título -->
  <h2 class="text-xl font-bold text-gray-800 mb-2">¿Estás seguro?</h2>

  <!-- Mensaje -->
  <p class="text-gray-600 mb-6">{{ data.mensaje }}</p>

  <!-- Botones -->
  <div class="flex justify-center gap-4">
    <button mat-stroked-button color="warn" (click)="cancelar()" class="px-6">
      Cancelar
    </button>
    <button mat-flat-button color="primary" (click)="confirmar()" class="px-6">
      Confirmar
    </button>
  </div>
</div>
