<div class="p-6 bg-white rounded-lg shadow">
  <h2 class="text-2xl font-semibold mb-6">Asignar Beneficiario a Proyecto</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Beneficiario -->
    <div>
      <label for="idBeneficiario" class="block text-sm font-medium text-gray-700 mb-1">
        Beneficiario *
      </label>
      <select
        id="idBeneficiario"
        formControlName="idBeneficiario"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
        <option value="">Seleccione un beneficiario</option>
        @for (beneficiario of beneficiarios; track beneficiario.idBeneficiario) {
          <option [value]="beneficiario.idBeneficiario">
            {{beneficiario.primerNombre}} {{beneficiario.primerApellido}} - {{beneficiario.numeroDocumento}}
          </option>
        }
      </select>
      @if(form.get('idBeneficiario')?.hasError('required') && form.get('idBeneficiario')?.touched) {
        <p class="mt-1 text-sm text-red-600">El beneficiario es requerido</p>
      }
    </div>

    <!-- Proyecto -->
    <div>
      <label for="idProyecto" class="block text-sm font-medium text-gray-700 mb-1">
        Proyecto *
      </label>
      <select
        id="idProyecto"
        formControlName="idProyecto"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
        <option value="">Seleccione un proyecto</option>
        @for (proyecto of proyectos; track proyecto.idProyecto) {
          <option [value]="proyecto.idProyecto">
            {{proyecto.nombre}} - {{proyecto.estado === 'A' ? 'Activo' : proyecto.estado === 'I' ? 'Inactivo' : 'Pendiente'}}
          </option>
        }
      </select>
      @if(form.get('idProyecto')?.hasError('required') && form.get('idProyecto')?.touched) {
        <p class="mt-1 text-sm text-red-600">El proyecto es requerido</p>
      }
    </div>

    <!-- Observaciones -->
    <div>
      <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">
        Observaciones
      </label>
      <textarea
        id="observaciones"
        formControlName="observaciones"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Observaciones opcionales"></textarea>
    </div>

    <!-- Botones -->
    <div class="flex justify-end space-x-4">
      <button
        type="button"
        (click)="cancel()"
        class="btn-action-gray">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn-action-blue">
        Guardar
      </button>
    </div>
  </form>
</div>
