@if (open) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 p-4">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-xl border border-slate-200 bg-white p-5 shadow-xl">
      <div aria-modal="true" aria-labelledby="create-secretary-title">
        <div class="mb-4 flex items-start justify-between gap-3">
          <div>
            <h2 id="create-secretary-title" class="text-lg font-bold text-slate-800">Crear secretaría</h2>
            <p class="text-sm text-slate-500">Incluye obligatoriamente usuario administrador y parámetros institucionales para dejar la administración completa.</p>
            <p class="mt-1 text-xs font-medium text-slate-500">Los campos marcados con <span class="text-red-600">*</span> son obligatorios.</p>
          </div>
          <button type="button" class="rounded-md p-1 text-slate-500 hover:bg-slate-100" (click)="onCancel()" aria-label="Cerrar modal">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
          <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Nombre
            <input class="input-base font-normal" formControlName="nombre" placeholder="Secretaría de Educación" />
          </label>
          <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Código
            <input class="input-base font-normal" formControlName="codigo" placeholder="EDU" />
          </label>
          <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Prefijo productos
            <input class="input-base font-normal" formControlName="prefijoProducto" placeholder="EDU" />
          </label>
        </div>

        <div class="mt-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <p class="mb-2 text-sm font-semibold text-slate-700">Datos del administrador</p>
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Primer nombre
              <input class="input-base font-normal" formControlName="adminPrimerNombre" placeholder="Nombre" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Segundo nombre
              <input class="input-base font-normal" formControlName="adminSegundoNombre" placeholder="Segundo nombre" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Primer apellido
              <input class="input-base font-normal" formControlName="adminPrimerApellido" placeholder="Apellido" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Segundo apellido
              <input class="input-base font-normal" formControlName="adminSegundoApellido" placeholder="Segundo apellido" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Tipo identificación
              <select class="input-base font-normal" formControlName="adminTipoIdentificacion">
                <option value="CC">CC</option>
                <option value="TI">TI</option>
                <option value="CE">CE</option>
                <option value="PA">PA</option>
                <option value="NIT">NIT</option>
              </select>
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Número identificación
              <input class="input-base font-normal" formControlName="adminNumeroIdentificacion" placeholder="Número identificación" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Correo
              <input class="input-base font-normal" formControlName="adminEmail" placeholder="correo@dominio.gov.co" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Teléfono
              <input class="input-base font-normal" formControlName="adminTelefono" placeholder="Teléfono" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Usuario
              <input class="input-base font-normal" formControlName="adminUsuario" placeholder="usuario.admin" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Contraseña temporal
              <input class="input-base font-normal" type="password" formControlName="adminPassword" placeholder="Mínimo 6 caracteres" />
            </label>
          </div>
        </div>

        <div class="mt-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <p class="mb-2 text-sm font-semibold text-slate-700">Parámetros institucionales</p>
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Nombre de la alcaldía
              <input class="input-base font-normal" formControlName="parametroNombreAlcaldia" placeholder="Alcaldía Municipal de ..." />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Nombre del alcalde
              <input class="input-base font-normal" formControlName="parametroNombreAlcalde" placeholder="Nombre del alcalde" />
            </label>
            <label class="text-sm font-semibold text-slate-700"><span class="text-red-600">*</span> Nombre de la secretaría
              <input class="input-base font-normal" formControlName="parametroNombreSecretaria" placeholder="Nombre de la secretaría" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Correo institucional
              <input class="input-base font-normal" formControlName="parametroCorreoAlcaldia" placeholder="correo@dominio.gov.co" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Dirección
              <input class="input-base font-normal" formControlName="parametroDireccionAlcaldia" placeholder="Dirección institucional" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Código postal
              <input class="input-base font-normal" formControlName="parametroCodigoPostal" placeholder="190001" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Contacto
              <input class="input-base font-normal" formControlName="parametroContactoAlcaldia" placeholder="Teléfono de contacto" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Firma acta (texto)
              <input class="input-base font-normal" formControlName="parametroFirmaActa" placeholder="Nombre para firma en actas" />
            </label>
          </div>
        </div>

        <div class="mt-5 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <button type="button" class="btn-action-gray" (click)="onCancel()">Cancelar</button>
          <button
            type="submit"
            class="rounded-md px-4 py-2 text-sm font-semibold transition-all"
            [ngClass]="loading || !canSubmit() ? 'cursor-not-allowed border border-slate-300 bg-slate-200 text-slate-500' : 'btn-action-green'"
            [disabled]="loading || !canSubmit()"
          >
            {{ loading ? 'Creando...' : 'Crear secretaría' }}
          </button>
        </div>
      </div>
    </form>
  </div>
}
