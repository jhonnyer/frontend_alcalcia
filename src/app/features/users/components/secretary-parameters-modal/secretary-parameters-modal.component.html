@if (open) {
  <div class="fixed inset-0 z-[110] flex items-center justify-center bg-black/40 p-4">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-slate-200 bg-white p-5 shadow-xl">
      <div aria-modal="true" aria-labelledby="edit-secretary-parameters-title">
        <div class="mb-4 flex items-start justify-between gap-3">
          <div>
            <h2 id="edit-secretary-parameters-title" class="text-lg font-bold text-slate-800">Parámetros institucionales</h2>
            <p class="text-sm text-slate-500">Edición para la secretaría: {{ secretariaName }}</p>
          </div>
          <button type="button" class="rounded-md p-1 text-slate-500 hover:bg-slate-100" (click)="onCancel()" aria-label="Cerrar modal">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        @if (loading) {
          <div class="flex items-center justify-center rounded-lg border border-dashed border-slate-200 px-4 py-10 text-sm text-slate-500">
            <mat-icon class="mr-2 animate-spin text-base">progress_activity</mat-icon>
            Cargando parámetros...
          </div>
        } @else {
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <label class="text-sm font-semibold text-slate-700">Nombre de la alcaldía
              <input class="input-base font-normal" formControlName="nombreAlcaldia" placeholder="Alcaldía Municipal de ..." />
            </label>
            <label class="text-sm font-semibold text-slate-700">Nombre del alcalde
              <input class="input-base font-normal" formControlName="nombreAlcalde" placeholder="Nombre del alcalde" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Nombre de la secretaría
              <input class="input-base font-normal" formControlName="nombreSecretaria" placeholder="Nombre de la secretaría" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Correo institucional
              <input class="input-base font-normal" formControlName="correoAlcaldia" placeholder="correo@dominio.gov.co" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Dirección
              <input class="input-base font-normal" formControlName="direccionAlcaldia" placeholder="Dirección institucional" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Código postal
              <input class="input-base font-normal" formControlName="codigoPostal" placeholder="190001" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Contacto
              <input class="input-base font-normal" formControlName="contactoAlcaldia" placeholder="Teléfono de contacto" />
            </label>
            <label class="text-sm font-semibold text-slate-700">Firma acta (texto)
              <input class="input-base font-normal" formControlName="firmaActa" placeholder="Nombre para firma en actas" />
            </label>
          </div>
          <div class="mt-5 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            <button type="button" class="btn-action-gray" (click)="onCancel()">Cancelar</button>
            <button type="submit" class="btn-action-blue" [disabled]="saving || form.invalid">
              {{ saving ? 'Guardando...' : 'Guardar parámetros' }}
            </button>
          </div>
        }
      </div>
    </form>
  </div>
}
