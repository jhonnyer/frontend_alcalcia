<nav class="w-full bg-transparent text-gray-900 rounded-xl transition-all px-2 py-2">
  <div class="flex flex-wrap justify-between items-center">
    
    <!-- 🔹 Título -->
    <div class="capitalize">
      <h6 class="font-sans text-base md:text-lg font-semibold tracking-tight leading-relaxed">
        {{ pageTitleService.currentPage() }}
      </h6>
    </div>

    <!-- 🔹 Controles de usuario -->
    <div class="flex items-center gap-2 md:gap-4" cdkMenuBar>

      <!-- Menú hamburguesa (móvil) -->
      <button
        cdkMenuItem
        [cdkMenuTriggerFor]="edit"
        class="relative flex items-center justify-center w-9 h-9 rounded-lg text-gray-600 hover:bg-gray-100 transition xl:hidden"
        type="button"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="h-6 w-6 text-blue-gray-600">
          <path fill-rule="evenodd"
            d="M3 6.75A.75.75 0 013.75 6h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 6.75zM3 12a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 12zm0 5.25a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75a.75.75 0 01-.75-.75z"
            clip-rule="evenodd"></path>
        </svg>
      </button>

      <!-- Rol visible -->
      @if(userRole() !== null) {
        <p
          class="text-xs font-medium text-gray-700 bg-gray-100 border border-gray-200 px-2 py-0.5 rounded-md hidden md:block"
        >
          {{ roleNames[userRole() ?? ''] || userRole() }}
        </p>
      }

      <!-- Botón Logout (Desktop) -->
      <button
        (click)="logout()"
        class="hidden xl:flex items-center gap-1 px-3 py-1 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="h-5 w-5 text-blue-gray-600">
          <path fill-rule="evenodd"
            d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
            clip-rule="evenodd"></path>
        </svg>
        Cerrar sesión
      </button>

      <!-- Botón Logout (Móvil) -->
      <button
        (click)="logout()"
        class="xl:hidden w-9 h-9 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 transition"
        type="button"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="h-5 w-5 text-blue-gray-600">
          <path fill-rule="evenodd"
            d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
            clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- Menú contextual -->
<ng-template #edit>
  <div class="example-menu" cdkMenu>
    <button class="example-menu-item" cdkMenuItem>Undo</button>
    <button class="example-menu-item" cdkMenuItem>Redo</button>
    <hr />
    <button class="example-menu-item" cdkMenuItem>Cut</button>
    <button class="example-menu-item" cdkMenuItem>Copy</button>
    <button class="example-menu-item" cdkMenuItem>Paste</button>
  </div>
</ng-template>
