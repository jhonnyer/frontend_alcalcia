<nav
  class="w-full bg-white/80 backdrop-blur border-b border-gray-200 
         text-gray-900 rounded-xl shadow-sm sticky top-0 z-40
         transition-all px-4 py-2"
>
  <div class="flex items-center justify-between flex-wrap gap-2">

    <!-- 🔹 Título -->
    <div class="flex items-center min-w-0 flex-1">
      <h6
        class="font-sans text-sm md:text-lg font-semibold tracking-tight leading-snug text-gray-800 whitespace-normal break-words line-clamp-3 md:line-clamp-2 cursor-pointer hover:text-blue-700 transition"
        (click)="goHome()"
        [title]="pageTitleService.currentPage()"
      >
        {{ pageTitleService.currentPage() }}
      </h6>
    </div>

    <!-- 🔹 Controles de usuario -->
    <div class="flex flex-wrap items-center gap-2 md:gap-4 w-full md:w-auto md:flex-shrink-0" cdkMenuBar>

      <!-- 👤 Rol visible -->
      @if (userRole() !== null) {
        <p
          class="text-xs font-medium text-gray-700 bg-gray-100 border border-gray-200
                 px-2 py-0.5 rounded-md whitespace-nowrap"
        >
          {{ roleNames[userRole() ?? ''] || userRole() }}
        </p>
      }

      @if (activeSecretaryId !== null) {
        <span
          class="min-w-0 max-w-full whitespace-normal break-words rounded-md border border-gray-200 bg-gray-50 px-2 py-1 text-xs text-gray-700 md:max-w-52 md:truncate md:whitespace-nowrap"
          [title]="activeSecretaryName"
        >
          {{ activeSecretaryName }}
        </span>
      }

      <!-- 🚪 Logout (Desktop) -->
      <button
        (click)="logout()"
        class="hidden xl:flex items-center gap-1 px-3 py-1 text-xs font-semibold 
               text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition"
      >
        <mat-icon class="text-base">logout</mat-icon>
        Cerrar sesión
      </button>

      <!-- 🚪 Logout (Móvil) -->
      <button
        (click)="logout()"
        class="xl:hidden ml-auto w-9 h-9 flex items-center justify-center 
               rounded-lg text-gray-600 hover:bg-gray-100 transition"
        type="button"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</nav>
