<ul class="mb-4 flex flex-col gap-1">
  <li class="mx-3.5 mt-4 mb-2">
    <p
      class="block font-sans text-sm leading-normal text-white font-black uppercase opacity-75 transition-all duration-200"
      [ngClass]="{ 'opacity-0 translate-x-[-10px] pointer-events-none': collapsed }"
    >
      Inicio
    </p>
  </li>

  <li>
    <a routerLink="home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      <button
        type="button"
        class="w-full flex items-center gap-4 px-4 py-3 text-xs rounded-lg font-bold text-white transition-colors duration-200 ease-in-out
               hover:bg-white/10 active:bg-white/30
               disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none"
        [ngClass]="{
          'justify-center': collapsed,
          'bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20': false
        }"
      >
        <!-- Icono -->
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             fill="currentColor"
             class="w-5 h-5 text-inherit flex-shrink-0">
          <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
          <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
        </svg>

        <!-- Texto -->
        <p
          class="text-base font-medium transition-all duration-200"
          [ngClass]="{
            'opacity-0 translate-x-[-10px] scale-95 pointer-events-none hidden': collapsed,
            'block': !collapsed
          }"
        >
          Inicio
        </p>
      </button>
    </a>
  </li>
</ul>
