<aside
  class="scrollbar-custom bg-gradient-to-br from-gray-800 to-gray-900 
         fixed inset-0 z-50 my-4 ml-4 h-[calc(100vh-32px)] w-72 
         rounded-xl transition-transform duration-300 
         xl:translate-x-0 overflow-y-auto shadow-lg"
>
  <!-- Header -->
  <div class="relative border-b border-white/20 flex justify-between items-center px-6 py-4">
    <h6 class="text-white font-semibold text-sm tracking-wide">
      Alcaldía de Almaguer
    </h6>

    <!-- Botón cerrar en móvil -->
    <button
      class="xl:hidden p-2 text-white hover:bg-white/10 rounded-lg"
      type="button"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Menú lateral -->
  <div class="m-4 space-y-1">
    <app-list-home />
    <app-list-nucleo />
    <app-list-beneficiary />
    <app-list-proceedings />
    <app-list-responsible *hasRole="['ADMIN']" />
    <app-list-projects />
    <app-list-categorias />
    <app-list-inventory />
  </div>
</aside>
