<aside
  class="
    scrollbar-custom bg-gradient-to-br from-gray-800 to-gray-900
    fixed z-[60] my-4 ml-4 h-[calc(100dvh-32px)] overscroll-contain
    rounded-xl shadow-lg overflow-y-auto select-none
    transition-transform duration-300 ease-in-out transform-gpu will-change-transform
  "
  [ngClass]="{
    'w-72 xl:translate-x-0 left-0 right-auto': !collapsed,
    'w-20 xl:translate-x-0 left-0 right-auto':  collapsed,
    '-translate-x-[110%] xl:translate-x-0': !open,
    'translate-x-0': open,
    'pointer-events-none': isAnimating  
  }"
  (transitionend)="isAnimating = false"
>

  <!-- Header -->
  <div
    class="sticky top-0 z-10 border-b border-white/20 
          flex items-center justify-between 
          px-4 py-3 bg-gradient-to-br from-gray-800 to-gray-900"
  >
    <h6 class="text-white font-semibold text-sm tracking-wide truncate">
      Alcaldía de Almaguer
    </h6>

    <!-- Cerrar en móvil -->
    <button
      class="xl:hidden p-2 text-white/90 hover:bg-white/10 rounded-lg"
      type="button"
      (click)="close()"
      aria-label="Cerrar menú"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>


  <!-- Menú -->
  <div class="m-3 space-y-1 pt-1">
    @if (isSuperAdmin) {
      <app-list-nucleo [collapsed]="collapsed" />
      <a routerLink="/users" routerLinkActive="bg-white/20"
        class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-semibold text-white hover:bg-white/10"
        [attr.title]="collapsed ? 'Panel administrativo' : null">
        <mat-icon>admin_panel_settings</mat-icon>
        @if (!collapsed) { <span>Panel administrativo</span> }
      </a>
      <a routerLink="/resposibles/soporte" routerLinkActive="bg-white/20"
        class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-semibold text-white hover:bg-white/10"
        [attr.title]="collapsed ? 'Soporte administrativo' : null">
        <mat-icon>support_agent</mat-icon>
        @if (!collapsed) { <span>Soporte administrativo</span> }
      </a>
    } @else {
    <app-list-home [collapsed]="collapsed" />
    <app-list-nucleo [collapsed]="collapsed" />
    <app-list-projects [collapsed]="collapsed" />
    <app-list-proceedings [collapsed]="collapsed" />
    <app-list-responsible [collapsed]="collapsed" *hasRole="['ADMIN', 'RESP', 'SUPERADMIN', 'USER', 'BENEF']" />
    }
  </div>

  <!-- Cerrar sesión -->
  <div class="sticky bottom-0 mt-4 border-t border-white/20 bg-gray-900 p-3">
    <button
      type="button"
      (click)="logout()"
      class="w-full flex items-center gap-4 px-4 py-3 text-xs rounded-lg font-bold text-white
             hover:bg-white/10 transition-colors duration-200"
    >
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </div>
</aside>
