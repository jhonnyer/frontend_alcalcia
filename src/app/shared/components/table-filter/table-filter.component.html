<label class="sr-only" [attr.for]="'table-filter-' + column().id">Filtrar {{ column().id }}</label>
<div class="relative">
  <input
    type="text"
    class="input w-full rounded-md border border-slate-300 px-2 py-1 pr-8 text-sm text-slate-800 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
    [id]="'table-filter-' + column().id"
    [value]="filterValue()"
    placeholder="Buscar..."
    autocomplete="off"
    (input)="onInputChange($event)"
  />
  @if (filterValue()) {
    <button
      type="button"
      class="absolute right-1 top-1/2 -translate-y-1/2 rounded p-1 text-slate-500 hover:bg-slate-100"
      (click)="clearFilter()"
      [attr.aria-label]="'Limpiar filtro de ' + column().id"
      title="Limpiar filtro"
    >
      <span aria-hidden="true">×</span>
    </button>
  }
</div>
