<label class="sr-only" [attr.for]="'table-filter-' + column().id">Filtrar {{ column().id }}</label>
<div class="relative min-w-[6.5rem]">
  <input
    type="text"
    class="w-full min-w-0 rounded-md border border-slate-300 bg-white py-1 pl-2 pr-7 text-xs font-normal normal-case tracking-normal text-slate-800 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
    [class.border-blue-400]="column().getFilterValue()"
    [class.bg-blue-50]="column().getFilterValue()"
    [id]="'table-filter-' + column().id"
    [value]="column().getFilterValue() ?? ''"
    [title]="column().getFilterValue() ?? ''"
    placeholder="Buscar..."
    autocomplete="off"
    (input)="onInputChange($event)"
  />
  @if (column().getFilterValue()) {
    <button
      type="button"
      class="absolute right-1 top-1/2 -translate-y-1/2 rounded px-1 leading-none text-slate-500 hover:bg-slate-100"
      (click)="clearFilter()"
      [attr.aria-label]="'Limpiar filtro de ' + column().id"
      title="Limpiar filtro"
    >
      <span aria-hidden="true">×</span>
    </button>
  }
</div>
