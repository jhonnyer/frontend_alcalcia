<div class="relative flex min-w-0 flex-col">

  @if(dataSource){
    <div class="w-full overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
      <table
        class="min-w-full text-left text-sm text-gray-600"
        cdk-table recycleRows
        [dataSource]="dataSource"
      >
      @for(column of displayedColumns(); track $index){
      <!-- Columns -->
      <ng-container [cdkColumnDef]="column">
        @if(this.stickyColumns().includes(column)){
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-bold tracking-wide text-slate-600" cdk-header-cell *cdkHeaderCellDef>
            {{column}}
          </th>
        }@else{
            <th sticky class="whitespace-nowrap px-4 py-3 text-left text-xs font-bold tracking-wide text-slate-600" cdk-header-cell *cdkHeaderCellDef>
            {{column}}
          </th>
        }
        @if(column === "controls"){
            <td cdk-cell *cdkCellDef="let element" class="flex gap-2 whitespace-nowrap px-4 py-3 font-medium">
            <button type="button" (click)="delete(element)" aria-label="Eliminar registro" title="Eliminar" class="rounded-md p-1 transition hover:bg-red-50">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#b91c1c"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
            </button>
            <button type="button" (click)="update(element)" aria-label="Editar registro" title="Editar" class="rounded-md p-1 transition hover:bg-emerald-50">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#22c55e"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
            </button>
          </td>
        }
        @else {
          <td scope="row" class="whitespace-nowrap px-4 py-3 font-medium text-gray-800" cdk-cell *cdkCellDef="let element">
            {{element[column]}}
          </td>
        }
      </ng-container>

      }

      <tr cdk-header-row *cdkHeaderRowDef="displayedColumns()" class="border-b border-slate-200 bg-slate-50"></tr>
      <tr cdk-row *cdkRowDef="let row; columns: displayedColumns();" class="border-b border-slate-100 bg-white text-slate-900 transition-colors hover:bg-blue-50/40"></tr>

      </table>
    </div>
  }
</div>
